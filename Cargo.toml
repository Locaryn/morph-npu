[package]
name = "locaryn-plugin-npu"
version = "0.1.0-beta.2"
edition = "2021"
description = "Runtime NPU Hexagon et GPU Adreno pour Snapdragon (Windows ARM64), basé sur Locaryn/llama-snapdragon"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-npu-launch"
path = "src/main.rs"

[[bin]]
name = "locaryn-npu-mcp"
path = "src/bin/npu_mcp.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[workspace]
